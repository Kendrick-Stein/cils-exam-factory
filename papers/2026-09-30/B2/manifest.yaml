    395 parole ottenuto solo con tagli. Per l’autore: modernizzare al massimo 12 occorrenze
    lessicali/ortografiche, per esempio figliuolo→figlio, in vece→invece, appuntino→esattamente,
    alacrità→energia; non parafrasare interi periodi né aggiungere raccordi. Dividere
    in 11 parti solo ai confini sintattici presenti. Verificare l’unicità dell’ordine
    con il blind solver; non inventare anafore per imporla.'
  selection: 'Paragrafo introduttivo: prime due frasi e dialogo finale da «Il figliuolo
    gli disse un giorno»; poi i due paragrafi consecutivi da «Il figliuolo sapeva»
    a «Ebbene, coraggio».'
